<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>播放端 · 大屏</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font:14px/1.5 'Microsoft YaHei',system-ui,sans-serif}
  #stage{position:fixed;inset:0;background:#000;overflow:hidden}
  #v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:0}
  #img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:0}
  #tools{position:absolute;right:14px;bottom:14px;z-index:12;display:none;gap:8px}
  #tools button{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;cursor:pointer}
  #tools button:hover{background:rgba(0,0,0,.75);border-color:#fff}
  #black{position:absolute;inset:0;background:#000;z-index:40;display:none}
  #badge{position:absolute;left:16px;top:14px;z-index:10;color:#fff;background:rgba(0,0,0,.55);padding:7px 13px;border-radius:8px;font-size:13px;letter-spacing:.2px;pointer-events:none;font-variant-numeric:tabular-nums;display:none}
  #sfxTag{position:absolute;left:16px;bottom:16px;z-index:10;color:#fff;background:rgba(0,0,0,.55);padding:7px 13px;border-radius:8px;font-size:14px;pointer-events:none;display:none}
  #osd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;color:#fff;background:rgba(0,0,0,.6);padding:14px 26px;border-radius:12px;font-size:26px;pointer-events:none;display:none;white-space:nowrap}
  #hint{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);cursor:pointer;color:#fff;text-align:center}
  #hint .hbox{font-size:30px;line-height:1.6}
  #hint .hs{display:block;font-size:15px;color:#9aa0a6;margin-top:10px;line-height:1.8}
  #hint .picks{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  #hint button{font:inherit;font-size:17px;padding:12px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.10);color:#fff;cursor:pointer}
  #hint button:hover{background:rgba(255,255,255,.22);border-color:#fff}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline preload="auto"></video>
  <img id="img" alt="" style="display:none">
  <div id="black"></div>
  <div id="badge"></div>
  <div id="sfxTag"></div>
  <div id="osd"></div>
  <div id="tools"><button id="toolAdd">＋ 素材</button><button id="toolFolder">＋ 文件夹</button></div>
  <div id="hint">
    <div class="hbox" id="hintStart">点击画面开始<small class="hs">一次点击同时解锁声音与全屏，之后交给控制台遥控</small></div>
    <div class="hbox" id="hintPick" style="display:none">
      先选择视频 / 图片素材
      <small class="hs">选一次 <b>win7-video</b> 文件夹即可；也可以把文件夹、视频、图片直接拖进这个窗口。<br>以后再想加新视频 / 图片：随时拖进来，或点右下角「＋ 素材」。<br>素材只在本机读取，不会上传到任何服务器。</small>
      <div class="picks">
        <button id="pickFolder">选择视频文件夹</button>
        <button id="pickFiles">选择视频 / 图片（可多选）</button>
        <button id="pickZip">导入排练包（zip）</button>
      </div>
      <div class="hs" id="pickMsg" style="color:#ffb8b8"></div>
    </div>
  </div>
  <input type="file" id="fileFolder" webkitdirectory directory multiple style="display:none">
<input type="file" id="fileFiles" accept="video/*,image/*,.png,.jpg,.jpeg,.gif,.webp,.bmp,.avif" multiple style="display:none">
<input type="file" id="fileZip" accept=".zip,application/zip" style="display:none">
</div>
<script>
(function () {
'use strict';

const CH = 'rp_sync';
const ME = 'player-' + Math.random().toString(36).slice(2, 7);
const bc = new BroadcastChannel(CH);
const $ = function (s) { return document.querySelector(s); };

const v = document.getElementById('v');
const imgEl = document.getElementById('img');
const badge = document.getElementById('badge');
const sfxTag = document.getElementById('sfxTag');
const osdEl = document.getElementById('osd');
const blackEl = document.getElementById('black');
const hint = document.getElementById('hint');

/* ---------------- 状态 ---------------- */
let clips = [];
let idx = 0;
let chain = false, loop = false;
let ab = { on: false, a: null, b: null };
let unlocked = false;
let quiet = false;
let duck = false, muteUser = false;
let fit = 'contain', black = false;
let imgMode = false;        /* 当前片段是图片 */
let imgHold = 5;           /* 图片停留秒数 */
let imgAuto = false;       /* 不连播时也让图片到点自动下一段 */
let imgPaused = false;
let imgT0 = 0, imgElapsed = 0;
let preview = { on: true, ms: 220, w: 320 };
let lastConsoleAt = 0;
let pendingSeek = null;
let fps = 0;
let osdTimer = null, osdOn = false;

/* ---------------- 小工具 ---------------- */
function clamp(x, a, b) { x = Number(x); if (!isFinite(x)) x = a; return x < a ? a : x > b ? b : x; }
function fmt(t) {
  if (!isFinite(t) || t < 0) t = 0;
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(Math.floor(t % 60)).padStart(2, '0');
}
/* 素材映射：部署版由使用者在大屏窗口选一次 win7-video，用 objectURL 顶替 media/xxx */
const fileMap = Object.create(null);
let useMap = false;       /* 已选本地素材 → 用 fileMap 解析片段地址 */
let booted = false;       /* 素材就绪，允许加载播放 */
let pendingClips = null;  /* 素材未就绪时暂存片段表 */
let ignoreClipsUntil = 0; /* 刚导入完包，短时间内不听控制台的片段表，避免互相覆盖 */
function baseName(p) { return String(p || '').split('?')[0].split(/[\\/]/).pop(); }
function keyOf(p) { return baseName(p).toLowerCase(); }
function absUrl(u) {
  const k = keyOf(u);
  if (k && fileMap[k]) return fileMap[k].url;
  try { return new URL(u, location.href).href; } catch (e) { return u; }
}
function addFile(f) {
  const e = { url: URL.createObjectURL(f), file: f };
  fileMap[keyOf(f.name)] = e;
  return e;
}
function clipOk(i) {
  const c = clips[i];
  if (!c) return false;
  if (!useMap) return true;
  return !!fileMap[keyOf(c.src)];
}
function snapIdx(i) {
  if (clipOk(i)) return i;
  for (let d = 1; d < clips.length; d++) {
    if (i - d >= 0 && clipOk(i - d)) return i - d;
    if (i + d < clips.length && clipOk(i + d)) return i + d;
  }
  return -1;
}
function stripNum(s) { return String(s || '').replace(/^\d+\s*·\s*/, ''); }
function clipNow() { return clips[idx] || null; }
/* ---------------- 图片片段（与视频混排） ---------------- */
const IMG_RE = /\.(jpg|jpeg|png|gif|webp|bmp|avif)$/i;
function isImgName(n) { return IMG_RE.test(String(n || '')); }
function isImgClip(c) { if (!c) return false; return c.kind ? c.kind === 'image' : isImgName(c.src); }
function isPlaying() { return imgMode ? !imgPaused : (!v.paused && !v.ended); }
function imgTime() { return imgMode ? (imgPaused ? imgElapsed : imgElapsed + (Date.now() - imgT0) / 1000) : 0; }
function imgLimit() { return clamp(imgHold, 1, 3600); }
function setImgPaused(on) {
  if (!imgMode) return;
  if (on && !imgPaused) { imgElapsed = imgTime(); imgPaused = true; }
  else if (!on && imgPaused) { imgPaused = false; imgT0 = Date.now(); }
}
function applyFit() { v.style.objectFit = fit; imgEl.style.objectFit = fit; }
function send(m, transfer) { m.from = ME; if (transfer) bc.postMessage(m, transfer); else bc.postMessage(m); }
function toast(text) { send({ k: 'toast', text: text }); }
function osd(text, ms) {
  osdEl.textContent = text;
  osdOn = true;
  clearTimeout(osdTimer);
  osdTimer = setTimeout(function () { osdOn = false; paint(); }, ms || 1100);
  paint();
}

/* ---------------- 缩略图（后台串行抽帧，只发给控制台显卡片，不干扰播放） ---------------- */
const THUMB_VID_W = 160;      /* 视频缩略图宽度 */
const THUMB_IMG_W = 320;      /* 图片缩略图宽度 */
const THUMB_GAP = 240;        /* 两个片段之间歇一下，老电脑更稳 */
const THUMB_MIN_SCORE = 10;   /* 亮度标准差低于此值算黑场，换个时间点再试 */
const thumbMap = Object.create(null);      /* src -> dataURL / 图片直链 */
const thumbPending = Object.create(null);
const thumbFailed = Object.create(null);
let thumbOn = true;                        /* 控制台可关掉，老电脑省点力气 */
let thumbChain = Promise.resolve();

function frameFlatScore(cv) {
  try {
    const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let n = 0, sum = 0, sum2 = 0;
    for (let i = 0; i < d.length; i += 12) {
      const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      sum += y; sum2 += y * y; n++;
    }
    if (!n) return 0;
    const mean = sum / n;
    return Math.sqrt(Math.max(0, sum2 / n - mean * mean));
  } catch (e) { return 999; }
}

/* 离屏 video 抽一帧（挑最不“空”的那帧，避开片头黑场） */
function makeVideoThumb(url) {
  return new Promise(function (resolve) {
    const el = document.createElement('video');
    let settled = false, waiting = false, hardTimer = null, seekTimer = null, paintTimer = null;
    let dur = 0, plan = [], nextAt = 0, best = null;
    function stop() {
      if (hardTimer) clearTimeout(hardTimer);
      if (seekTimer) clearTimeout(seekTimer);
      if (paintTimer) clearTimeout(paintTimer);
      try { el.removeAttribute('src'); el.load(); } catch (e) {}
    }
    function done() {
      if (settled) return;
      settled = true;
      stop();
      resolve(best ? best.thumb : null);
    }
    function seekNext() {
      if (settled) return;
      if (nextAt >= plan.length) return done();
      try { el.currentTime = plan[nextAt++]; } catch (e) { return done(); }
      waiting = true;
      seekTimer = setTimeout(function () { if (waiting) grab(); }, 1200);
    }
    function grab() {
      if (settled || !waiting) return;
      waiting = false;
      if (seekTimer) { clearTimeout(seekTimer); seekTimer = null; }
      if (paintTimer) { clearTimeout(paintTimer); paintTimer = null; }
      const vw = el.videoWidth, vh = el.videoHeight;
      if (vw && vh) {
        try {
          const tw = THUMB_VID_W, th = Math.max(1, Math.round(vh * tw / vw));
          const cv = document.createElement('canvas');
          cv.width = tw; cv.height = th;
          cv.getContext('2d').drawImage(el, 0, 0, tw, th);
          const score = frameFlatScore(cv);
          if (!best || score > best.score) best = { thumb: cv.toDataURL('image/jpeg', 0.72), score: score };
        } catch (e) {}
      }
      if (best && best.score >= THUMB_MIN_SCORE) return done();
      seekNext();
    }
    el.onseeked = function () {
      if (!waiting || settled) return;
      if (seekTimer) { clearTimeout(seekTimer); seekTimer = null; }
      if (paintTimer) clearTimeout(paintTimer);
      paintTimer = setTimeout(grab, 90);   /* 等一帧真画出来再取像 */
    };
    hardTimer = setTimeout(done, 9000);
    el.preload = 'metadata'; el.muted = true; el.playsInline = true;
    el.onloadedmetadata = function () {
      dur = el.duration;
      if (!el.videoWidth) return done();
      const d = (isFinite(dur) && dur > 0) ? dur : 1;
      plan = [Math.min(Math.max(0.3, d * 0.12), 4)];
      if (d > 6) plan.push(Math.min(Math.max(plan[0] + 1.2, d * 0.55), d - 0.15));
      seekNext();
    };
    el.onerror = function () { done(); };
    el.src = url;
  });
}

/* 图片缩成小图；画不动（极少见）就直接把原图地址给控制台 */
function makeImgThumb(url) {
  return new Promise(function (resolve) {
    const im = new Image();
    let settled = false;
    const fin = function (out) { if (settled) return; settled = true; resolve(out); };
    const timer = setTimeout(function () { fin(null); }, 8000);
    im.onload = function () {
      clearTimeout(timer);
      const w = im.naturalWidth || 0, h = im.naturalHeight || 0;
      if (!w || !h) return fin(null);
      const tw = Math.min(THUMB_IMG_W, w), th = Math.max(1, Math.round(h * tw / w));
      try {
        const cv = document.createElement('canvas');
        cv.width = tw; cv.height = th;
        cv.getContext('2d').drawImage(im, 0, 0, tw, th);
        fin(cv.toDataURL('image/jpeg', 0.78));
      } catch (e) { fin(url); }
    };
    im.onerror = function () { clearTimeout(timer); fin(null); };
    im.src = url;
  });
}

function enqueueThumb(task) {
  thumbChain = thumbChain
    .then(function () { return new Promise(function (r) { setTimeout(r, THUMB_GAP); }); })
    .then(task)
    .catch(function () {});
  return thumbChain;
}
function thumbOf(c) { return (c && c.src) ? (thumbMap[c.src] || null) : null; }
function sendThumbsAll() {
  const all = {};
  clips.forEach(function (c) { const t = thumbOf(c); if (t) all[c.src] = t; });
  send({ k: 'thumbs', all: all });
}
/* 没人在看控制台就别白耗 CPU（控制台每 2.5s 回应一次 hello） */
/* 片段表一变就调它：把缺的缩略图排进后台队列 */
function consoleNear() { return Date.now() - lastConsoleAt < 60000; }
function syncThumbs() {
  if (!clips.length) return;
  if (!thumbOn) return;
  if (!consoleNear()) return;
  clips.forEach(function (c) {
    if (!c || !c.src) return;
    const src = c.src;
    if (useMap && !fileMap[keyOf(src)]) return;   /* 本窗口没这个素材，别去 404 浪费时间 */
    if (thumbMap[src] || thumbPending[src] || thumbFailed[src]) return;
    const isImg = isImgClip(c);
    const url = absUrl(src);
    thumbPending[src] = 1;
    enqueueThumb(function () {
      return (isImg ? makeImgThumb(url) : makeVideoThumb(url)).then(function (data) {
        delete thumbPending[src];
        if (!data) { thumbFailed[src] = 1; return; }
        thumbMap[src] = data;
        const add = {}; add[src] = data;
        send({ k: 'thumbs', add: add });
      });
    });
  });
}
function clearThumbs() {
  [thumbMap, thumbPending, thumbFailed].forEach(function (m) {
    Object.keys(m).forEach(function (k) { delete m[k]; });
  });
}


/* ---------------- 画面上的浮层 ---------------- */
function paint() {
  const fsOn = !!document.fullscreenElement;
  const hide = quiet || fsOn;
  const c = clipNow();
  const toolsEl = $('#tools');
  if (toolsEl) toolsEl.style.display = (unlocked && !hide) ? 'flex' : 'none';
  if (!unlocked || hide) {
    badge.style.display = 'none';
  } else {
    badge.style.display = 'block';
    const dur = imgMode ? imgLimit() : (isFinite(v.duration) ? v.duration : (c ? c.dur : 0));
    const conn = (Date.now() - lastConsoleAt < 6000) ? '' : ' · 无控制台';
    badge.textContent = (isPlaying() ? '\u25B6 ' : '\u275A\u275A ') +
      (c ? (idx + 1) + '/' + clips.length + ' · ' + stripNum(c.label) : '等待片段') +
      ' · ' + fmt(imgMode ? imgTime() : v.currentTime) + '/' + fmt(dur) + (imgMode ? ' · 图片' : '') +
      (black ? ' · 黑场' : '') + (fit === 'cover' ? ' · 铺满' : '') + conn;
  }
  osdEl.style.display = (!hide && osdOn) ? 'block' : 'none';
  const act = activeLabels();
  sfxTag.style.display = (!hide && act.length) ? 'block' : 'none';
  if (act.length) sfxTag.textContent = '\u266A ' + act.join('  +  ');
}

/* ---------------- 音效池（可并发，独立循环与淡入淡出） ---------------- */
const POOL = 4;
const pool = [];
let sfxVol = 1;
const sfxLoopCfg = {};
let lastSfxLabel = null;

for (let i = 0; i < POOL; i++) {
  const el = document.createElement('audio');
  el.preload = 'auto';
  if (i === 0) el.id = 'sfx';
  el.volume = 0;
  el.dataset.slot = String(i);
  el.addEventListener('play', function () { mix(); paint(); });
  el.addEventListener('pause', function () { mix(); paint(); });
  el.addEventListener('ended', function () { onSfxEnd(el); });
  document.body.appendChild(el);
  pool.push({ el: el, label: null, startedAt: 0, timer: null });
}
function slotOf(el) { for (let i = 0; i < pool.length; i++) if (pool[i].el === el) return pool[i]; return null; }
function activeSlots() { return pool.filter(function (s) { return !!s.el.src && !s.el.paused && !s.el.ended; }); }
function activeLabels() {
  const out = [];
  pool.forEach(function (s) {
    if (s.el.src && !s.el.paused && !s.el.ended && s.label && out.indexOf(s.label) < 0) out.push(s.label);
  });
  return out;
}
function anySfx() { return activeSlots().length > 0; }
function mix() { v.muted = !!muteUser || (!!duck && anySfx()); }

function fadeTo(s, target, ms) {
  if (s.timer) { clearInterval(s.timer); s.timer = null; }
  const el = s.el;
  const from = clamp(el.volume, 0, 1);
  target = clamp(target, 0, 1);
  if (ms <= 0) { el.volume = target; return; }
  const t0 = Date.now();
  s.timer = setInterval(function () {
    const k = Math.min(1, (Date.now() - t0) / ms);
    el.volume = clamp(from + (target - from) * k, 0, 1);
    if (k >= 1) { clearInterval(s.timer); s.timer = null; el.volume = target; }
  }, 30);
}

function playSfx(url, label) {
  if (!url) return;
  label = label || decodeURIComponent(String(url).split('/').pop() || '音效');
  let s = null;
  pool.forEach(function (x) { if (!s && x.label === label && !x.el.paused) s = x; });
  if (!s) pool.forEach(function (x) { if (!s && x.el.paused && !x.el.src) s = x; });
  if (!s) pool.forEach(function (x) { if (!s && x.el.paused) s = x; });
  if (!s) s = pool.slice().sort(function (a, b) { return a.startedAt - b.startedAt; })[0];

  const el = s.el;
  const abs = absUrl(url);
  if (el.src !== abs) el.src = abs;
  s.label = label;
  s.startedAt = Date.now();
  el.loop = !!sfxLoopCfg[label];
  el.volume = 0;
  try { el.currentTime = 0; } catch (e) {}
  const p = el.play();
  if (p && p.catch) p.catch(function () { toast('音效播放失败：' + label); });
  fadeTo(s, sfxVol, 200);
  lastSfxLabel = label;
  mix(); paint();
  osd('\u266A ' + label, 900);
  sendState();
}

function onSfxEnd(el) {
  const s = slotOf(el);
  if (s) {
    s.label = null;
    if (s.timer) { clearInterval(s.timer); s.timer = null; }
    if (!el.loop) el.volume = 0;
  }
  mix(); paint(); sendState();
}

function stopSfx(label) {
  pool.forEach(function (s) {
    if (label && s.label !== label) return;
    if (!s.el.src) return;
    if (s.el.paused) { s.label = null; return; }
    const el = s.el;
    fadeTo(s, 0, 160);
    setTimeout(function () {
      try { el.pause(); el.currentTime = 0; } catch (e) {}
      el.volume = 0;
      const t = slotOf(el);
      if (t) t.label = null;
      mix(); paint(); sendState();
    }, 200);
  });
  mix(); paint();
  osd('\u266A 停止', 650);
  sendState();
}

function setSfxVol(x) {
  sfxVol = clamp(x, 0, 1);
  pool.forEach(function (s) {
    if (!s.el.src) return;
    if (s.el.paused) s.el.volume = sfxVol; else fadeTo(s, sfxVol, 110);
  });
}

/* ---------------- 播放核心 ---------------- */
function setTime(t) {
  if (imgMode) return;   /* 图片片段没有时间轴 */
  t = Number(t);
  if (!isFinite(t) || t < 0) t = 0;
  if (v.readyState === 0) { pendingSeek = t; return; }
  try { v.currentTime = t; } catch (e) { pendingSeek = t; }
}
function tryPlay() { const p = v.play(); if (p && p.catch) p.catch(function () {}); }
function tryPause() { try { v.pause(); } catch (e) {} }
function togglePlay() {
  if (imgMode) { setImgPaused(!imgPaused); paint(); sendState(); return; }
  if (v.paused || v.ended) tryPlay(); else tryPause();
}

function loadAt(i, at) {
  if (!clips.length) return;
  i = Math.round(clamp(i, 0, clips.length - 1));
  const j = snapIdx(i);
  if (j < 0) { osd('没有可用素材', 1200); return; }
  if (j !== i) { osd('缺素材：' + stripNum(clips[i].label) + ' → ' + stripNum(clips[j].label), 1400); i = j; }
  const c = clips[i];
  const abs = absUrl(c.src);
  if (isImgClip(c)) {
    const same = imgMode && idx === i && imgEl.src === abs;
    idx = i;
    imgMode = true; imgPaused = false; imgElapsed = 0; imgT0 = Date.now();
    if (!same) {
      try { v.pause(); } catch (e) {}
      try { v.removeAttribute('src'); v.load(); } catch (e) {}
      imgEl.style.display = 'block';
      imgEl.style.objectFit = fit;
      imgEl.src = abs;
    }
    paint(); sendState();
    return;
  }
  if (imgMode) { imgMode = false; imgPaused = false; imgEl.style.display = 'none'; try { imgEl.removeAttribute('src'); } catch (e) {} }
  if (v.src !== abs) {
    idx = i;
    v.src = abs;
    applyFit();
    pendingSeek = Number(at) || 0;
    try { v.load(); } catch (e) {}
    tryPlay();
  } else {
    idx = i;
    setTime(Number(at) || 0);
    tryPlay();

let qPrev = null, qT = 0;

  if (imgMode) return;

  const now = Date.now();
  if (qPrev && q.totalVideoFrames > qPrev.totalVideoFrames && now - qT > 400) {
    fps = Math.round((q.totalVideoFrames - qPrev.totalVideoFrames) / ((now - qT) / 1000));
    qPrev = q; qT = now;
  } else if (!qPrev || now - qT > 1200) { qPrev = q; qT = now; }

  const sh = imgMode ? imgEl.naturalHeight : v.videoHeight;
  if (!sw || !sh) return;
  if (Date.now() - lastConsoleAt > 6000) return;
  pvBusy = true;
  const w = clamp(preview.w, 120, 640);
  const h = Math.max(60, Math.round(w * sh / sw));
  if (pv.width !== w || pv.height !== h) { pv.width = w; pv.height = h; }
  try { pv.getContext('2d').drawImage(srcEl, 0, 0, w, h); } catch (e) { pvBusy = false; return; }

/* 控制台可能只认识 clips.json 里的片段；把我们本地已经载入的素材合并保留，别被覆盖掉 */
function mergeClips(list) {

  const out = [];
  list.forEach(function (c) { if (c && c.src && !have[keyOf(c.src)]) { have[keyOf(c.src)] = 1; out.push(c); } });
  let kept = 0;
  clips.forEach(function (c) {
    if (!c || !c.src || have[keyOf(c.src)]) return;

    const isImg = isImgName(f.name);

    extra.push({ label: stripNum(f.name.replace(/\.[^.]+$/, '')), src: 'media/' + f.name, dur: isImg ? imgHold : null, kind: isImg ? 'image' : 'video' });
    added++;

  if (!booted && !hit && !pics) {
    releaseMap();
    showPick();
    pickMsg('没匹配到任何片段，请选择 win7-video 文件夹（共 24 个 mp4）');
    toast('没匹配到片段');
    return;
  }
  if (!filled && !added) { pickMsg('这些素材已经在列表里了'); toast('没有新增素材（' + dup + ' 个重复）'); return; }

  const fresh = !booted && !hit;   /* 第一次给的全是图片：片段表就只放这些图片 */
  const std = Object.create(null);
  FALLBACK_CLIPS.forEach(function (c) { std[keyOf(c.src)] = 1; });
  /* 还没开播时，别人广播过来的片段表里对本窗口没用的（本地没素材、也不在标准表里）直接丢掉，免得出现幽灵卡片 */
  const head = clips.length ? clips.slice() : (fresh ? [] : base.filter(function (c) { return !!fileMap[keyOf(c.src)] || !!std[keyOf(c.src)]; }));
  clips = head.concat(extra).map(function (c, i) {
    return { label: pad2(i + 1) + ' · ' + stripNum(c.label), src: c.src, dur: c.dur, kind: c.kind };
  });
  useMap = true;
  pendingClips = null;
  pickMsg('');
  if (!booted) {
    booted = true;
    $('#hintPick').style.display = 'none';
    $('#hintStart').style.display = 'block';
    loadAt(0, 0);
  }
  send({ k: 'clips', list: clips });
  toast('素材：新增 ' + added + ' 个 · 补上 ' + filled + ' 个' + (dup ? ' · 跳过重复 ' + dup + ' 个' : ''));
  syncThumbs();
}

function entryFiles(entry, out, depth) {
  return new Promise(function (res) {
    if (!entry || depth > 6) return res();
    if (entry.isFile) return entry.file(function (f) { out.push(f); res(); }, function () { res(); });
    if (!entry.isDirectory) return res();
    const rd = entry.createReader();
    const all = [];
    const step = function () {
      rd.readEntries(function (batch) {
        if (!batch || !batch.length) {
          Promise.all(all.map(function (en) { return entryFiles(en, out, depth + 1); })).then(function () { res(); }, function () { res(); });
          return;
        }
        all.push.apply(all, batch);
        step();
      }, function () { res(); });
    };
    step();
  });
}

$('#pickFolder').addEventListener('click', function (e) { e.stopPropagation(); $('#fileFolder').click(); });

function onPicked(e) {

}

/* 拖拽：整个文件夹或一批视频 / 图片直接丢进窗口；已开播后再拖进来＝继续追加 */
window.addEventListener('dragover', function (e) {
  e.preventDefault();
  if (!booted) { showPick(); pickMsg('松开即载入（支持整个文件夹，视频与图片都行）'); }
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('drop', function (e) {
  e.preventDefault();
  const dt = e.dataTransfer;
  if (!dt) return;
  const wasBooted = booted;
  const items = dt.items ? Array.prototype.slice.call(dt.items) : [];
  const out = [];
  const jobs = [];
  items.forEach(function (it) {
    if (it.kind !== 'file') return;
    const en = it.webkitGetAsEntry && it.webkitGetAsEntry();
    if (en) jobs.push(entryFiles(en, out, 0));
  });
  const fin = function () {
    if (out.length) { addMedia(out); if (!wasBooted && booted) unlockNow(); }
    else if (dt.files && dt.files.length) { addMedia(dt.files); if (!wasBooted && booted) unlockNow(); }
  };
  if (jobs.length) Promise.all(jobs).then(fin, fin); else fin();
});

/* 素材探测：同源已有 media/ 就直接开播（本地样本）；否则要求先选一次素材 */
/* ---------------- 排练包：导出 / 导入 ZIP（视频只在本机打包，不上传） ---------------- */
const MEDIA_RE = /\.(mp4|m4v|mov|webm|mkv|avi|ts|jpg|jpeg|png|gif|webp|bmp|avif)$/i;
const AUDIO_RE = /\.(mp3|m4a|wav|ogg)$/i;
function pad2(n) { return String(n).padStart(2, '0'); }
const crcTable = (function () {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c; }
  return t;
})();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
const zte = new TextEncoder();
const ztd = new TextDecoder();
function z16(x) { const b = new Uint8Array(2); new DataView(b.buffer).setUint16(0, x, true); return b; }
function z32(x) { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, x, true); return b; }
function zod() { const d = new Date(); return { time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate() }; }
function zcat(arrs) { let t = 0; for (let i = 0; i < arrs.length; i++) t += arrs[i].length; const o = new Uint8Array(t); let p = 0; for (let i = 0; i < arrs.length; i++) { o.set(arrs[i], p); p += arrs[i].length; } return o; }
function buildZip(entries) {
  const parts = [], central = [];
  let offset = 0;
  const od = zod();
  entries.forEach(function (e) {
    const nb = zte.encode(e.path);
    const crc = crc32(e.data);
    const local = zcat([z32(0x04034b50), z16(20), z16(0x0800), z16(0), z16(od.time), z16(od.date), z32(crc), z32(e.data.length), z32(e.data.length), z16(nb.length), z16(0)]);
    parts.push(local, nb, e.data);
    central.push(zcat([z32(0x02014b50), z16(20), z16(20), z16(0x0800), z16(0), z16(od.time), z16(od.date), z32(crc), z32(e.data.length), z32(e.data.length), z16(nb.length), z16(0), z16(0), z16(0), z16(0), z32(0), z32(offset)]), nb);
    offset += local.length + nb.length + e.data.length;
  });
  let cs = 0; central.forEach(function (a) { cs += a.length; });
  const end = zcat([z32(0x06054b50), z16(0), z16(0), z16(entries.length), z16(entries.length), z32(cs), z32(offset), z16(0)]);

}
function guessType(n) {
  const e = String(n).split('.').pop().toLowerCase();
  if (e === 'mp4' || e === 'm4v' || e === 'mov') return 'video/mp4';
  if (e === 'webm') return 'video/webm';
  if (e === 'mkv') return 'video/x-matroska';
  if (e === 'mp3') return 'audio/mpeg';
  if (e === 'm4a') return 'audio/mp4';
  if (e === 'wav') return 'audio/wav';
  if (e === 'ogg') return 'audio/ogg';
  if (e === 'jpg' || e === 'jpeg') return 'image/jpeg';
  if (e === 'png') return 'image/png';
  if (e === 'gif') return 'image/gif';
  if (e === 'webp') return 'image/webp';

}
async function readZipFile(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 22 - 65536); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 ZIP 文件');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = new Map();
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP 目录解析失败');
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    const lp = dv.getUint32(p + 42, true);

    if (dv.getUint32(lp, true) !== 0x04034b50) throw new Error('ZIP 局部头解析失败');
    const ln = dv.getUint16(lp + 26, true), le = dv.getUint16(lp + 28, true);
    let data = buf.subarray(lp + 30 + ln + le, lp + 30 + ln + le + csize);
    if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else if (method !== 0) throw new Error('包里有不支持的压缩方式');
    out.set(name, data);
    p += 46 + nameLen + extraLen + commentLen;

}
let sfxDefs = null;
function getSfxDefs() {
  if (sfxDefs) return Promise.resolve(sfxDefs);
  return fetch('sfx.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (l) { sfxDefs = Array.isArray(l) ? l : []; return sfxDefs; })
    .catch(function () { sfxDefs = []; return sfxDefs; });
}
function prefsOut() {
  return {
    vol: v.volume, muted: !!muteUser, duck: duck, quiet: quiet, chain: chain, loop: loop,
    speed: v.playbackRate, sfxVol: sfxVol, black: black, fit: fit,
    ab: { on: ab.on, a: ab.a, b: ab.b },
    sfxLoops: Object.keys(sfxLoopCfg).filter(function (k) { return sfxLoopCfg[k]; })
  };
}
async function exportZip(consolePrefs) {
  if (!useMap || !clips.length) { toast('先选一次素材（或导入排练包）才能打包'); return; }
  const cfg = { version: 2, at: new Date().toISOString(), clips: [], sfx: [], prefs: null, console: consolePrefs || null };
  const entries = [];
  let n = 0;
  for (let i = 0; i < clips.length; i++) {
    const c = clips[i];
    const e = fileMap[keyOf(c.src)];
    if (!e || !e.file) continue;
    toast('打包中 ' + (i + 1) + '/' + clips.length + ' · ' + e.file.name + '（请看大屏窗口）');
    await new Promise(function (r) { setTimeout(r, 0); });
    try {
      const path = 'videos/' + pad2(i + 1) + '_' + e.file.name;
      entries.push({ path: path, data: new Uint8Array(await e.file.arrayBuffer()) });
      cfg.clips.push({ file: e.file.name, path: path, type: guessType(e.file.name), label: stripNum(c.label), duration: isFinite(c.dur) ? c.dur : null });
      n++;
    } catch (err) { toast('跳过 ' + e.file.name + '（读不出来）'); }
  }
  if (!n) { toast('没有可打包的素材'); return; }
  const defs = await getSfxDefs();
  for (let i = 0; i < defs.length; i++) {
    const s = defs[i];
    const name = baseName(s.src);
    try {
      let data = null;
      const local = fileMap[keyOf(name)];
      if (local && local.file) data = new Uint8Array(await local.file.arrayBuffer());
      else { const r = await fetch(s.src); if (r.ok) data = new Uint8Array(await r.arrayBuffer()); }
      if (!data) continue;
      const path = 'sfx/' + pad2(i + 1) + '_' + name;
      entries.push({ path: path, data: data });
      cfg.sfx.push({ file: name, path: path, label: s.label || name });
    } catch (err) {}
  }
  cfg.prefs = prefsOut();
  entries.push({ path: 'config.json', data: zte.encode(JSON.stringify(cfg)) });
  toast('正在生成 zip（' + entries.length + ' 个文件）…');
  const blob = await buildZip(entries);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  a.href = URL.createObjectURL(blob);
  a.download = '排练包-' + stamp + '.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
  toast('已导出 ' + a.download + '（' + Math.round(blob.size / 1048576) + ' MB）');
}
function applyPrefs(p) {
  if (!p) return;
  if (isFinite(p.vol)) v.volume = clamp(p.vol, 0, 1);
  if (isFinite(p.speed)) v.playbackRate = clamp(p.speed, 0.25, 4);
  if (isFinite(p.sfxVol)) setSfxVol(p.sfxVol);
  muteUser = !!p.muted; duck = !!p.duck; quiet = !!p.quiet;
  chain = !!p.chain; loop = !!p.loop;
  black = !!p.black; blackEl.style.display = black ? 'block' : 'none';
  fit = (p.fit === 'cover') ? 'cover' : 'contain'; applyFit();
  if (p.ab && p.ab.on && p.ab.a != null) ab = { on: true, a: p.ab.a, b: p.ab.b };
  if (Array.isArray(p.sfxLoops)) p.sfxLoops.forEach(function (lb) { sfxLoopCfg[lb] = true; });
  applyLoopToSlots();
  mix(); paint(); sendState();
}
async function importZip(file) {
  toast('正在读取 ' + file.name + ' …');
  const map = await readZipFile(file);
  let cfg = null;
  const raw = map.get('config.json');
  if (raw) { try { cfg = JSON.parse(ztd.decode(raw)); } catch (e) { cfg = null; } }
  const base = clips.length ? clips.slice() : ((pendingClips && pendingClips.length) ? pendingClips.slice() : FALLBACK_CLIPS);
  const baseK = base.map(function (c) { return keyOf(c.src); });
  const stdByKey = Object.create(null);
  FALLBACK_CLIPS.forEach(function (c) { const k = keyOf(c.src); if (!stdByKey[k]) stdByKey[k] = c; });
  releaseMap();
  const vids = [];
  map.forEach(function (data, path) {
    const name = baseName(path);
    if (AUDIO_RE.test(name)) { const an = name.replace(/^\d{2,3}_/, ''); if (!fileMap[keyOf(an)]) addFile(new File([data], an, { type: guessType(an) })); return; }
    if (MEDIA_RE.test(name)) vids.push({ name: name.replace(/^\d{2,3}_/, ''), data: data, path: path });
  });
  if (!vids.length) throw new Error('包里没有视频 / 图片文件');
  /* 严格按包内 config.clips 的顺序重建；config 里没记的素材接在最后 */
  const byKey = Object.create(null);
  vids.forEach(function (x) { const k = keyOf(x.name); if (!byKey[k]) byKey[k] = x; });
  const out = [], seen = Object.create(null), extra = [];
  let skip = 0;
  const pushClip = function (nm, label, dur, isImg, data) {
    const k = keyOf(nm);
    if (!k || seen[k]) return;
    seen[k] = 1;
    if (data && !fileMap[k]) addFile(new File([data], nm, { type: guessType(nm) }));
    out.push({
      label: stripNum(label || nm.replace(/\.[^.]+$/, '')),
      src: 'media/' + nm,
      dur: (typeof dur === 'number' && isFinite(dur)) ? dur : (isImg ? imgHold : null),
      kind: isImg ? 'image' : 'video'
    });
  };
  if (cfg && Array.isArray(cfg.clips) && cfg.clips.length) {
    cfg.clips.forEach(function (c) {
      const nm = baseName(c.file || c.path || '');
      const k = keyOf(nm);
      if (!k || seen[k]) return;
      const hit = byKey[k];
      if (!hit) return;              /* 包内没这个文件，跳过 */
      const isImg = /^image/i.test(String(c.type || '')) || isImgName(nm);
      const std = stdByKey[k];
      const dur = (typeof c.duration === 'number' && isFinite(c.duration)) ? c.duration
        : (std && typeof std.dur === 'number' && isFinite(std.dur) ? std.dur : null);
      pushClip(nm, c.label, dur, isImg, hit.data);
    });
  } else {
    vids.slice().sort(function (a, b) { return a.path < b.path ? -1 : 1; }).forEach(function (x) {
      pushClip(x.name, null, null, isImgName(x.name), x.data);
    });
  }
  /* config 里没有、包里有的素材：接在片段表最后 */
  vids.forEach(function (x) {
    const k = keyOf(x.name);
    if (!k || seen[k]) return;
    const isImg = isImgName(x.name);
    seen[k] = 1;
    addFile(new File([x.data], x.name, { type: guessType(x.name) }));
    extra.push({ label: stripNum(x.name.replace(/\.[^.]+$/, '')), src: 'media/' + x.name, dur: isImg ? imgHold : null, kind: isImg ? 'image' : 'video' });
  });
  const head = out.length ? out : [];
  clips = head.map(function (c, i) { return { label: pad2(i + 1) + ' · ' + stripNum(c.label), src: c.src, dur: c.dur, kind: c.kind }; })
    .concat(extra.map(function (c, i) { return { label: pad2(head.length + i + 1) + ' · ' + c.label, src: c.src, dur: c.dur, kind: c.kind }; }));
  skip = extra.length;
  if (!clips.length) throw new Error('包里的素材认不出来');
  useMap = true;
  booted = true;
  pendingClips = null;
  ignoreClipsUntil = Date.now() + 4000;
  $('#hintPick').style.display = 'none';
  $('#hintStart').style.display = 'block';
  pickMsg('');
  loadAt(0, 0);
  send({ k: 'clips', list: clips });
  applyPrefs(cfg && cfg.prefs);
  syncThumbs();
  if (cfg && cfg.console) send({ k: 'prefs', prefs: cfg.console });
  let miss = 0;
  clips.forEach(function (c) { if (!fileMap[keyOf(c.src)]) miss++; });
  toast('已导入 ' + clips.length + ' 个片段' + (skip ? '（包内新增 ' + skip + ' 个）' : '') + (miss ? '，其中 ' + miss + ' 个缺素材' : ''));
}
$('#pickZip').addEventListener('click', function (e) { e.stopPropagation(); $('#fileZip').click(); });
$('#fileZip').addEventListener('change', function (e) {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  importZip(f).then(function () { unlockNow(); }, function (err) {
    const msg = (err && err.message) || '未知错误';
    showPick(); pickMsg('导入失败：' + msg); toast('导入失败：' + msg);
  });
});

function probeMaterials(list) {
  const src = list[0] && list[0].src;
  if (!src) return Promise.resolve(false);
  return new Promise(function (res) {
    let done = false;
    const fin = function (v) { if (!done) { done = true; res(v); } };
    const t = setTimeout(function () { fin(false); }, 4000);
    try {
      fetch(src, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        clearTimeout(t); fin(!!r && r.ok);
      }, function () { clearTimeout(t); fin(false); });
    } catch (e) { clearTimeout(t); fin(false); }
  });
}
function withTimeout(p, ms, back) {
  return Promise.race([p, new Promise(function (res) { setTimeout(function () { res(back); }, ms); })]);
}

(function boot() {
  const get = fetch('clips.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('clips.json ' + r.status); return r.json(); })
    .catch(function () { return null; });
  withTimeout(get, 6000, null).then(function (l) {
    if (!Array.isArray(l) || !l.length) l = null;
    if (!l) { showPick(); return; }
    return probeMaterials(l).then(function (ok) {
      if (!ok) { if (!pendingClips) pendingClips = l; showPick(); return; }
      booted = true;
      setClips(pendingClips && pendingClips.length ? pendingClips : l);
      pendingClips = null;
    });
  }).catch(function () { showPick(); });
})();

window.__dbg = function () {

  return {

    vol: v.volume, muted: !!v.muted, speed: v.playbackRate,
    unlocked: unlocked, quiet: quiet, duck: duck, chain: chain, loop: loop,
    ab: { on: ab.on, a: ab.a, b: ab.b },

    sfxVol: sfxVol, sfxLoop: Object.assign({}, sfxLoopCfg),
    fs: !!document.fullscreenElement, fit: fit, black: black, fps: fps,
    metersOn: meter.on, meterOk: !!meter.ok, meterV: meter.v, meterS: meter.s,
    booted: booted, useMap: useMap, mapCount: Object.keys(fileMap).length,
    pending: pendingClips ? pendingClips.length : 0,
    img: imgMode, imgHold: imgLimit(), imgAuto: imgAuto, imgPaused: imgPaused, imgTime: imgTime(), imgClips: clips.filter(isImgClip).length,
    labels: clips.map(function (x) { return x.label; }),
