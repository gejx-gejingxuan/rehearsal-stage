<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>播放端 · 大屏</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font:14px/1.5 'Microsoft YaHei',system-ui,sans-serif}
  #stage{position:fixed;inset:0;background:#000;overflow:hidden}
  #v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:0}
  #black{position:absolute;inset:0;background:#000;z-index:40;display:none}
  #badge{position:absolute;left:16px;top:14px;z-index:10;color:#fff;background:rgba(0,0,0,.55);padding:7px 13px;border-radius:8px;font-size:13px;letter-spacing:.2px;pointer-events:none;font-variant-numeric:tabular-nums;display:none}
  #sfxTag{position:absolute;left:16px;bottom:16px;z-index:10;color:#fff;background:rgba(0,0,0,.55);padding:7px 13px;border-radius:8px;font-size:14px;pointer-events:none;display:none}
  #osd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;color:#fff;background:rgba(0,0,0,.6);padding:14px 26px;border-radius:12px;font-size:26px;pointer-events:none;display:none;white-space:nowrap}
  #hint{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);cursor:pointer;color:#fff;text-align:center}
  #hint .hbox{font-size:30px;line-height:1.6}
  #hint .hs{display:block;font-size:15px;color:#9aa0a6;margin-top:10px;line-height:1.8}
  #hint .picks{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  #hint button{font:inherit;font-size:17px;padding:12px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.10);color:#fff;cursor:pointer}
  #hint button:hover{background:rgba(255,255,255,.22);border-color:#fff}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline preload="auto"></video>
  <div id="black"></div>
  <div id="badge"></div>
  <div id="sfxTag"></div>
  <div id="osd"></div>
  <div id="hint">
    <div class="hbox" id="hintStart">点击画面开始<small class="hs">一次点击同时解锁声音与全屏，之后交给控制台遥控</small></div>
    <div class="hbox" id="hintPick" style="display:none">
      先选择视频素材
      <small class="hs">选一次 <b>win7-video</b> 文件夹即可；也可以把文件夹或视频直接拖进这个窗口。<br>素材只在本机读取，不会上传到任何服务器。</small>
      <div class="picks">
        <button id="pickFolder">选择视频文件夹</button>
        <button id="pickFiles">选择视频文件（可多选）</button>
        <button id="pickZip">导入排练包（zip）</button>
      </div>
      <div class="hs" id="pickMsg" style="color:#ffb8b8"></div>
    </div>
  </div>
  <input type="file" id="fileFolder" webkitdirectory directory multiple style="display:none">
  <input type="file" id="fileFiles" accept="video/*" multiple style="display:none">
<input type="file" id="fileZip" accept=".zip,application/zip" style="display:none">
</div>
<script>
(function () {
'use strict';

const CH = 'rp_sync';
const ME = 'player-' + Math.random().toString(36).slice(2, 7);
const bc = new BroadcastChannel(CH);
const $ = function (s) { return document.querySelector(s); };

const v = document.getElementById('v');
const badge = document.getElementById('badge');
const sfxTag = document.getElementById('sfxTag');
const osdEl = document.getElementById('osd');
const blackEl = document.getElementById('black');
const hint = document.getElementById('hint');

/* ---------------- 状态 ---------------- */
let clips = [];
let idx = 0;
let chain = false, loop = false;
let ab = { on: false, a: null, b: null };
let unlocked = false;
let quiet = false;
let duck = false, muteUser = false;
let fit = 'contain', black = false;
let preview = { on: true, ms: 220, w: 320 };
let lastConsoleAt = 0;
let pendingSeek = null;
let fps = 0;
let osdTimer = null, osdOn = false;

/* ---------------- 小工具 ---------------- */
function clamp(x, a, b) { x = Number(x); if (!isFinite(x)) x = a; return x < a ? a : x > b ? b : x; }
function fmt(t) {
  if (!isFinite(t) || t < 0) t = 0;
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(Math.floor(t % 60)).padStart(2, '0');
}
/* 素材映射：部署版由使用者在大屏窗口选一次 win7-video，用 objectURL 顶替 media/xxx */
const fileMap = Object.create(null);
let useMap = false;       /* 已选本地素材 → 用 fileMap 解析片段地址 */
let booted = false;       /* 素材就绪，允许加载播放 */
let pendingClips = null;  /* 素材未就绪时暂存片段表 */
let ignoreClipsUntil = 0; /* 刚导入完包，短时间内不听控制台的片段表，避免互相覆盖 */
function baseName(p) { return String(p || '').split('?')[0].split(/[\\/]/).pop(); }
function keyOf(p) { return baseName(p).toLowerCase(); }
function absUrl(u) {
  const k = keyOf(u);
  if (k && fileMap[k]) return fileMap[k].url;
  try { return new URL(u, location.href).href; } catch (e) { return u; }
}
function addFile(f) {
  const e = { url: URL.createObjectURL(f), file: f };
  fileMap[keyOf(f.name)] = e;
  return e;
}
function clipOk(i) {
  const c = clips[i];
  if (!c) return false;
  if (!useMap) return true;
  return !!fileMap[keyOf(c.src)];
}
function snapIdx(i) {
  if (clipOk(i)) return i;
  for (let d = 1; d < clips.length; d++) {
    if (i - d >= 0 && clipOk(i - d)) return i - d;
    if (i + d < clips.length && clipOk(i + d)) return i + d;
  }
  return -1;
}
function stripNum(s) { return String(s || '').replace(/^\d+\s*·\s*/, ''); }
function clipNow() { return clips[idx] || null; }
function send(m, transfer) { m.from = ME; if (transfer) bc.postMessage(m, transfer); else bc.postMessage(m); }
function toast(text) { send({ k: 'toast', text: text }); }
function osd(text, ms) {
  osdEl.textContent = text;
  osdOn = true;
  clearTimeout(osdTimer);
  osdTimer = setTimeout(function () { osdOn = false; paint(); }, ms || 1100);
  paint();
}

/* ---------------- 画面上的浮层 ---------------- */
function paint() {
  const fsOn = !!document.fullscreenElement;
  const hide = quiet || fsOn;
  const c = clipNow();
  if (!unlocked || hide) {
    badge.style.display = 'none';
  } else {
    badge.style.display = 'block';
    const dur = isFinite(v.duration) ? v.duration : (c ? c.dur : 0);
    const conn = (Date.now() - lastConsoleAt < 6000) ? '' : ' · 无控制台';
    badge.textContent = (v.paused ? '\u275A\u275A ' : '\u25B6 ') +
      (c ? (idx + 1) + '/' + clips.length + ' · ' + stripNum(c.label) : '等待片段') +
      ' · ' + fmt(v.currentTime) + '/' + fmt(dur) +
      (black ? ' · 黑场' : '') + (fit === 'cover' ? ' · 铺满' : '') + conn;
  }
  osdEl.style.display = (!hide && osdOn) ? 'block' : 'none';
  const act = activeLabels();
  sfxTag.style.display = (!hide && act.length) ? 'block' : 'none';
  if (act.length) sfxTag.textContent = '\u266A ' + act.join('  +  ');
}

/* ---------------- 音效池（可并发，独立循环与淡入淡出） ---------------- */
const POOL = 4;
const pool = [];
let sfxVol = 1;
const sfxLoopCfg = {};
let lastSfxLabel = null;

for (let i = 0; i < POOL; i++) {
  const el = document.createElement('audio');
  el.preload = 'auto';
  if (i === 0) el.id = 'sfx';
  el.volume = 0;
  el.dataset.slot = String(i);
  el.addEventListener('play', function () { mix(); paint(); });
  el.addEventListener('pause', function () { mix(); paint(); });
  el.addEventListener('ended', function () { onSfxEnd(el); });
  document.body.appendChild(el);
  pool.push({ el: el, label: null, startedAt: 0, timer: null });
}
function slotOf(el) { for (let i = 0; i < pool.length; i++) if (pool[i].el === el) return pool[i]; return null; }
function activeSlots() { return pool.filter(function (s) { return !!s.el.src && !s.el.paused && !s.el.ended; }); }
function activeLabels() {
  const out = [];
  pool.forEach(function (s) {
    if (s.el.src && !s.el.paused && !s.el.ended && s.label && out.indexOf(s.label) < 0) out.push(s.label);
  });
  return out;
}
function anySfx() { return activeSlots().length > 0; }
function mix() { v.muted = !!muteUser || (!!duck && anySfx()); }

function fadeTo(s, target, ms) {
  if (s.timer) { clearInterval(s.timer); s.timer = null; }
  const el = s.el;
  const from = clamp(el.volume, 0, 1);
  target = clamp(target, 0, 1);
  if (ms <= 0) { el.volume = target; return; }
  const t0 = Date.now();
  s.timer = setInterval(function () {
    const k = Math.min(1, (Date.now() - t0) / ms);
    el.volume = clamp(from + (target - from) * k, 0, 1);
    if (k >= 1) { clearInterval(s.timer); s.timer = null; el.volume = target; }
  }, 30);
}

function playSfx(url, label) {
  if (!url) return;
  label = label || decodeURIComponent(String(url).split('/').pop() || '音效');
  let s = null;
  pool.forEach(function (x) { if (!s && x.label === label && !x.el.paused) s = x; });
  if (!s) pool.forEach(function (x) { if (!s && x.el.paused && !x.el.src) s = x; });
  if (!s) pool.forEach(function (x) { if (!s && x.el.paused) s = x; });
  if (!s) s = pool.slice().sort(function (a, b) { return a.startedAt - b.startedAt; })[0];

  const el = s.el;
  const abs = absUrl(url);
  if (el.src !== abs) el.src = abs;
  s.label = label;
  s.startedAt = Date.now();
  el.loop = !!sfxLoopCfg[label];
  el.volume = 0;
  try { el.currentTime = 0; } catch (e) {}
  const p = el.play();
  if (p && p.catch) p.catch(function () { toast('音效播放失败：' + label); });
  fadeTo(s, sfxVol, 200);
  lastSfxLabel = label;
  mix(); paint();
  osd('\u266A ' + label, 900);
  sendState();
}

function onSfxEnd(el) {
  const s = slotOf(el);
  if (s) {
    s.label = null;
    if (s.timer) { clearInterval(s.timer); s.timer = null; }
    if (!el.loop) el.volume = 0;
  }
  mix(); paint(); sendState();
}

function stopSfx(label) {
  pool.forEach(function (s) {
    if (label && s.label !== label) return;
    if (!s.el.src) return;
    if (s.el.paused) { s.label = null; return; }
    const el = s.el;
    fadeTo(s, 0, 160);
    setTimeout(function () {
      try { el.pause(); el.currentTime = 0; } catch (e) {}
      el.volume = 0;
      const t = slotOf(el);
      if (t) t.label = null;
      mix(); paint(); sendState();
    }, 200);
  });
  mix(); paint();
  osd('\u266A 停止', 650);
  sendState();
}

function setSfxVol(x) {
  sfxVol = clamp(x, 0, 1);
  pool.forEach(function (s) {
    if (!s.el.src) return;
    if (s.el.paused) s.el.volume = sfxVol; else fadeTo(s, sfxVol, 110);
  });
}

/* ---------------- 播放核心 ---------------- */
function setTime(t) {
  t = Number(t);
  if (!isFinite(t) || t < 0) t = 0;
  if (v.readyState === 0) { pendingSeek = t; return; }
  try { v.currentTime = t; } catch (e) { pendingSeek = t; }
}
function tryPlay() { const p = v.play(); if (p && p.catch) p.catch(function () {}); }
function tryPause() { try { v.pause(); } catch (e) {} }

function loadAt(i, at) {
  if (!clips.length) return;
  i = Math.round(clamp(i, 0, clips.length - 1));
  const j = snapIdx(i);
  if (j < 0) { osd('没有可用素材', 1200); return; }
  if (j !== i) { osd('缺素材：' + stripNum(clips[i].label) + ' → ' + stripNum(clips[j].label), 1400); i = j; }
  const c = clips[i];
  const abs = absUrl(c.src);
  if (v.src !== abs) {
    idx = i;
    v.src = abs;
    v.style.objectFit = fit;
    pendingSeek = Number(at) || 0;
    try { v.load(); } catch (e) {}
    tryPlay();
  } else {
    idx = i;
    setTime(Number(at) || 0);
    tryPlay();
  }
  paint(); sendState();
}
function stepClip(d) {
  if (!clips.length) return;
  let t = -1;
  const st = d > 0 ? 1 : -1;
  for (let i = idx + d; i >= 0 && i < clips.length; i += st) { if (clipOk(i)) { t = i; break; } }
  if (t < 0) { osd(d > 0 ? '已是最后一个片段' : '已是第一个片段', 900); return; }
  loadAt(t, 0);
  osd((d > 0 ? '\u25B6\u25B6 ' : '\u25C0\u25C0 ') + (t + 1) + '/' + clips.length + ' · ' + stripNum(clips[t].label), 1100);
}
function stepFrame(dir) {
  tryPause();
  const rate = (fps > 1 ? fps : 25);
  let t = (v.currentTime || 0) + dir / rate;
  if (t < 0) t = 0;
  if (isFinite(v.duration) && t > v.duration) t = v.duration;
  setTime(t);
  osd((dir > 0 ? '\u25B6| ' : '|\u25C0 ') + '逐帧', 700);
  sendState();
}
function setAb(mode) {
  const t = v.currentTime || 0;
  if (mode === 'clear') { ab = { on: false, a: null, b: null }; osd('AB 已清除', 800); }
  else if (mode === 'on') { ab.on = ab.a != null && ab.b != null; }
  else if (mode === 'off') { ab.on = false; }
  else if (mode === 'a') {
    ab.a = t;
    if (ab.b != null && ab.b <= ab.a) { const x = ab.a; ab.a = ab.b; ab.b = x; }
    ab.on = ab.a != null && ab.b != null;
    osd('A = ' + t.toFixed(1) + 's', 900);
  } else if (mode === 'b') {
    if (ab.a == null) ab.a = 0;
    ab.b = t;
    if (ab.b <= ab.a) { const x = ab.a; ab.a = ab.b; ab.b = x; }
    ab.on = true;
    osd('B = ' + t.toFixed(1) + 's', 900);
  }
  sendState();
}
function onEnded() {
  if (loop) { setTime(0); tryPlay(); return; }
  if (chain) {
    for (let i = idx + 1; i < clips.length; i++) { if (clipOk(i)) { loadAt(i, 0); return; } }
  }
  paint(); sendState();
}

/* ---------------- 全屏 / 无提示 ---------------- */
/* 全屏时浮层本来就隐藏（见 paint），「无提示」开关保持独立，互不影响 */
function toggleFs(on) {
  const want = (on === undefined) ? !document.fullscreenElement : !!on;
  if (want === !!document.fullscreenElement) { paint(); return; }
  if (want) {
    const p = document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(function () {
      toast('全屏被浏览器拒绝：请先在大屏窗口点一下画面，再按全屏');
    });
  } else {
    const p = document.exitFullscreen();
    if (p && p.catch) p.catch(function () {});
  }
}
document.addEventListener('fullscreenchange', function () {
  /* 进/退全屏只影响浮层显示，不改 quiet 开关 */
  paint(); sendState();
});

/* ---------------- 状态广播 ---------------- */
function sendState() {
  const c = clipNow();
  send({
    k: 'state',
    idx: idx,
    playing: !v.paused && !v.ended,
    time: v.currentTime || 0,
    dur: isFinite(v.duration) ? v.duration : (c ? c.dur : 0),
    vol: v.volume,
    muted: !!v.muted,
    speed: v.playbackRate,
    unlocked: unlocked,
    count: clips.length,
    label: c ? c.label : '',
    chain: chain, loop: loop,
    ab: { on: ab.on, a: ab.a, b: ab.b },
    sfxVol: sfxVol,
    duck: duck, quiet: quiet,
    fs: !!document.fullscreenElement,
    sfxPlaying: anySfx(),
    sfxLabel: lastSfxLabel,
    sfxActive: activeLabels(),
    sfxLoops: Object.keys(sfxLoopCfg).filter(function (k) { return sfxLoopCfg[k]; }),
    fps: fps,
    fit: fit,
    black: black,
    metersOn: meter.on,
    meterOk: !!meter.ok,
    preview: preview.on
  });
}

/* ---------------- 帧率探测 ---------------- */
let qPrev = null, qT = 0;
function measureFps() {
  if (typeof v.getVideoPlaybackQuality !== 'function') return;
  if (v.paused || !v.videoWidth) return;
  const q = v.getVideoPlaybackQuality();
  const now = Date.now();
  if (qPrev && q.totalVideoFrames > qPrev.totalVideoFrames && now - qT > 400) {
    fps = Math.round((q.totalVideoFrames - qPrev.totalVideoFrames) / ((now - qT) / 1000));
    qPrev = q; qT = now;
  } else if (!qPrev || now - qT > 1200) { qPrev = q; qT = now; }
}

/* ---------------- 预览帧推送 ---------------- */
const pv = document.createElement('canvas');
let pvBusy = false, pvTimer = null;
function schedulePreview() {
  if (pvTimer) clearInterval(pvTimer);
  pvTimer = setInterval(pushFrame, clamp(preview.ms, 80, 2000));
}
function pushFrame() {
  if (!preview.on || pvBusy) return;
  if (!v.videoWidth) return;
  if (Date.now() - lastConsoleAt > 6000) return;
  pvBusy = true;
  const w = clamp(preview.w, 120, 640);
  const h = Math.max(60, Math.round(w * v.videoHeight / v.videoWidth));
  if (pv.width !== w || pv.height !== h) { pv.width = w; pv.height = h; }
  try { pv.getContext('2d').drawImage(v, 0, 0, w, h); } catch (e) { pvBusy = false; return; }
  pv.toBlob(function (b) {
    pvBusy = false;
    if (!b) return;
    b.arrayBuffer().then(function (buf) {
      send({ k: 'frame', w: w, h: h, buf: buf }, [buf]);
    }).catch(function () {});
  }, 'image/jpeg', 0.6);
}

/* ---------------- 真实电平表（captureStream 旁路取样，不改播放路径） ---------------- */
const meter = { on: false, ok: false, ctx: null, items: new Map(), v: 0, s: 0, failAt: 0 };

function meterWhy() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return '浏览器不支持音频分析';
  if (typeof v.captureStream !== 'function') return '浏览器不支持 captureStream';
  return '';
}
function meterItem(el) {
  const cached = meter.items.get(el);
  if (cached && cached !== 'fail') return cached;
  if (cached === 'fail' && Date.now() - meter.failAt < 2000) return null;
  let it = null;
  try {
    const stream = el.captureStream();
    const at = stream.getAudioTracks();
    stream.getVideoTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
    if (at.length) {
      const src = meter.ctx.createMediaStreamSource(new MediaStream(at));
      const an = meter.ctx.createAnalyser();
      an.fftSize = 512;
      src.connect(an);
      it = { an: an, buf: new Float32Array(an.fftSize), stream: stream, src: src };
    }
  } catch (e) { it = null; }
  if (!it) { meter.failAt = Date.now(); meter.items.set(el, 'fail'); return null; }
  meter.items.set(el, it);
  return it;
}
function meterRead(it) {
  if (!it) return 0;
  it.an.getFloatTimeDomainData(it.buf);
  let m = 0;
  for (let i = 0; i < it.buf.length; i++) { const a = it.buf[i] < 0 ? -it.buf[i] : it.buf[i]; if (a > m) m = a; }
  return m;
}
function meterTick() {
  if (!meter.on) return;
  const mv = meterRead(meterItem(v));
  let ms = 0;
  activeSlots().forEach(function (s) { const x = meterRead(meterItem(s.el)); if (x > ms) ms = x; });
  meter.v = mv; meter.s = ms;
  send({ k: 'meters', v: Math.round(mv * 1000) / 1000, s: Math.round(ms * 1000) / 1000 });
}
function setMeters(on) {
  on = !!on;
  if (on === meter.on) { sendState(); return; }
  if (on) {
    const why = meterWhy();
    if (why) { meter.on = false; meter.ok = false; toast('电平表不可用：' + why); sendState(); return; }
    try {
      if (!meter.ctx) meter.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (meter.ctx.state === 'suspended') meter.ctx.resume().catch(function () {});
      meter.items.clear();
      meter.failAt = 0;
      meter.on = true; meter.ok = true;
      osd('电平表：开', 900);
    } catch (e) {
      meter.on = false; meter.ok = false;
      toast('电平表不可用：' + e.message);
    }
  } else {
    meter.on = false;
    meter.items.forEach(function (it) {
      if (it && it !== 'fail') { try { it.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} }
    });
    meter.items.clear();
    meter.v = 0; meter.s = 0;
    osd('电平表：关', 900);
  }
  sendState();
}

/* ---------------- 视频事件 ---------------- */
v.addEventListener('loadedmetadata', function () {
  if (pendingSeek != null) { try { v.currentTime = pendingSeek; } catch (e) {} pendingSeek = null; }
  paint(); sendState();
});
v.addEventListener('loadeddata', function () {
  if (pendingSeek != null) { try { v.currentTime = pendingSeek; } catch (e) {} pendingSeek = null; }
});
v.addEventListener('play', function () { paint(); sendState(); });
v.addEventListener('pause', function () { paint(); sendState(); });
v.addEventListener('ended', onEnded);
v.addEventListener('timeupdate', function () {
  if (ab.on && ab.a != null && ab.b != null && v.currentTime >= ab.b - 0.04) {
    try { v.currentTime = ab.a; } catch (e) {}
  }
});
v.addEventListener('error', function () {
  const c = clipNow();
  if (c) toast('视频加载失败：' + stripNum(c.label));
});

/* ---------------- 指令 ---------------- */
function applyLoopToSlots() {
  pool.forEach(function (s) { if (s.label) s.el.loop = !!sfxLoopCfg[s.label]; });
}
function handleCmd(m) {
  switch (m.action) {
    case 'goto': loadAt(m.idx, m.at || 0); break;

  const seq = [];
  if (cfg && Array.isArray(cfg.clips)) cfg.clips.forEach(function (c) { seq.push(baseName(c.file || c.path).replace(/^\d{2,3}_/, '')); });
  if (!seq.length) seq = vids.slice().sort(function (a, b) { return a.path < b.path ? -1 : 1; }).map(function (x) { return x.name; });
  const out = [], seen = Object.create(null);
  let skip = 0;
  seq.forEach(function (name) {
    const k = keyOf(name);
    const i = baseK.indexOf(k);
    if (i < 0 || seen[i]) { skip++; return; }
    seen[i] = 1;
    out.push(base[i]);
    for (let j = 0; j < vids.length; j++) {
      if (keyOf(vids[j].name) !== k) continue;
      if (!fileMap[k]) addFile(new File([vids[j].data], baseName(vids[j].name), { type: guessType(vids[j].name) }));
      break;
    }
  });
  if (out.length) {
    clips = out.map(function (c, i) { return { label: pad2(i + 1) + ' · ' + stripNum(c.label), src: c.src, dur: c.dur }; });
  } else {
    const files = vids.slice().sort(function (a, b) { return a.path < b.path ? -1 : 1; });
    clips = files.map(function (x, i) {
      const k = keyOf(x.name);
      if (!fileMap[k]) addFile(new File([x.data], x.name, { type: guessType(x.name) }));
      return { label: pad2(i + 1) + ' · ' + stripNum(x.name.replace(/\.[^.]+$/, '')), src: 'media/' + x.name, dur: null };
    });
    skip = 0;
  }
  if (!clips.length) throw new Error('包里的素材认不出来');
  useMap = true;
  booted = true;
  pendingClips = null;
  ignoreClipsUntil = Date.now() + 4000;
  $('#hintPick').style.display = 'none';
  $('#hintStart').style.display = 'block';
  pickMsg('');
  loadAt(0, 0);
  send({ k: 'clips', list: clips });
  applyPrefs(cfg && cfg.prefs);
  if (cfg && cfg.console) send({ k: 'prefs', prefs: cfg.console });
  let miss = 0;
  clips.forEach(function (c) { if (!fileMap[keyOf(c.src)]) miss++; });
  toast('已导入 ' + clips.length + ' 个片段' + (skip ? '（包内 ' + skip + ' 个素材不认识，已忽略）' : '') + (miss ? '，其中 ' + miss + ' 个缺素材' : ''));
}
$('#pickZip').addEventListener('click', function (e) { e.stopPropagation(); $('#fileZip').click(); });
$('#fileZip').addEventListener('change', function (e) {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  importZip(f).then(function () { unlockNow(); }, function (err) {
    const msg = (err && err.message) || '未知错误';
    showPick(); pickMsg('导入失败：' + msg); toast('导入失败：' + msg);
  });
});

function probeMaterials(list) {
  const src = list[0] && list[0].src;
  if (!src) return Promise.resolve(false);
  return new Promise(function (res) {
    let done = false;
    const fin = function (v) { if (!done) { done = true; res(v); } };
    const t = setTimeout(function () { fin(false); }, 4000);
    try {
      fetch(src, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        clearTimeout(t); fin(!!r && r.ok);
      }, function () { clearTimeout(t); fin(false); });
    } catch (e) { clearTimeout(t); fin(false); }
  });
}
function withTimeout(p, ms, back) {
  return Promise.race([p, new Promise(function (res) { setTimeout(function () { res(back); }, ms); })]);
}

(function boot() {
  const get = fetch('clips.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('clips.json ' + r.status); return r.json(); })
    .catch(function () { return null; });
  withTimeout(get, 6000, null).then(function (l) {
    if (!Array.isArray(l) || !l.length) l = null;
    if (!l) { showPick(); return; }
    return probeMaterials(l).then(function (ok) {
      if (!ok) { if (!pendingClips) pendingClips = l; showPick(); return; }
      booted = true;
      setClips(pendingClips && pendingClips.length ? pendingClips : l);
      pendingClips = null;
    });
  }).catch(function () { showPick(); });
})();

window.__dbg = function () {
  const c = clipNow();
  return {
    idx: idx, count: clips.length, label: c ? c.label : '',
    paused: v.paused, playing: !v.paused && !v.ended,
    time: v.currentTime, dur: isFinite(v.duration) ? v.duration : (c ? c.dur : 0),
    vol: v.volume, muted: !!v.muted, speed: v.playbackRate,
    unlocked: unlocked, quiet: quiet, duck: duck, chain: chain, loop: loop,
    ab: { on: ab.on, a: ab.a, b: ab.b },
    sfxPlaying: anySfx(), sfxLabel: lastSfxLabel, sfxActive: activeLabels(),
    sfxVol: sfxVol, sfxLoop: Object.assign({}, sfxLoopCfg),
    fs: !!document.fullscreenElement, fit: fit, black: black, fps: fps,
    metersOn: meter.on, meterOk: !!meter.ok, meterV: meter.v, meterS: meter.s,
    booted: booted, useMap: useMap, mapCount: Object.keys(fileMap).length,
    previewOn: preview.on, src: v.src
  };
};
})();
</script>
